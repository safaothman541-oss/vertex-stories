# Generated by Vertex Story Studio (compile.js). Do not edit by hand.
# After every push to main, ask jsDelivr to drop its cached copy of dist/director.js, every
# stories/*/plan.json and every other changed file under dist/ and stories/. Every engine loads the
# director and its plan from @main, so a push to main goes live as soon as the cache is purged.
name: Purge jsDelivr cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Purge the director, the plans and changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          base="https://purge.jsdelivr.net/gh/safaothman541-oss/vertex-stories@main"
          zero="0000000000000000000000000000000000000000"
          {
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git -c core.quotepath=off diff --name-only "$BEFORE" "$AFTER" -- dist stories
            else
              git -c core.quotepath=off ls-files -- dist stories
            fi
            # the director and every plan are live code: purge them on every push, changed or not
            git -c core.quotepath=off ls-files -- dist/director.js "stories/*/plan.json"
          } | sort -u > changed.txt
          if [ ! -s changed.txt ]; then
            echo "Nothing to purge under dist/ or stories/."
            exit 0
          fi
          failed=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "Purging $f"
            if ! curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$base/$f"; then
              echo "::warning::jsDelivr purge failed for $f"
              failed=1
            fi
            echo
          done < changed.txt
          exit "$failed"
